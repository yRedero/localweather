modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Redero"
description='''
Replaces global weather with storm cells that form, drift with the wind and fade out, so it can rain in one place and be clear in another.
Built as a companion to Better Clouds.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Only applies when Better Clouds is installed, see BetterCloudsMixinPlugin.
[[mixins]]
config="${mod_id}.betterclouds.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="betterclouds"
    type="optional"
    versionRange="${betterclouds_version_range}"
    ordering="AFTER"
    side="CLIENT"
