plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'fabric-loom' version '1.15.5' apply false
}

subprojects {
    apply plugin: 'java-library'

    version = mod_version
    group = mod_group_id
    base.archivesName = "${mod_id}-${project.name}"

    // Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        // Better Clouds, YACL and Mod Menu are published on Modrinth.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
        // Forge Config API Port: NeoForge's config system on Fabric, and its API for the common code.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fuzs'
                    url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
                }
            }
            filter {
                includeGroup 'fuzs.forgeconfigapiport'
            }
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }

    dependencies {
        // @Nullable: Minecraft ships it, but Fabric's dev classpath doesn't.
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// The loaders compile the common sources and resources into their own jars (so mixin refmaps and metadata
// see everything), instead of depending on a common jar.
configure([project(':neoforge'), project(':fabric')]) {
    configurations {
        commonJava {
            canBeResolved = true
            canBeConsumed = false
        }
        commonResources {
            canBeResolved = true
            canBeConsumed = false
        }
    }
    dependencies {
        commonJava project(path: ':common', configuration: 'commonJava')
        commonResources project(path: ':common', configuration: 'commonResources')
    }
    tasks.named('compileJava', JavaCompile) {
        dependsOn configurations.commonJava
        source configurations.commonJava
    }
    tasks.named('processResources', ProcessResources) {
        dependsOn configurations.commonResources
        from configurations.commonResources
    }
}
